<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- friendly rounded font; loads without blocking the page, so if it is blocked the site just uses the phone's normal font -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'">
<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--brand:#4f46e5;--brand2:#eef2ff;--ok:#16a34a;--bad:#dc2626;--line:#e5e7eb}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
  header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;box-shadow:0 2px 12px rgba(79,70,229,.25)}
  main{max-width:720px;margin:0 auto;padding:16px 16px 100px}
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);overflow-x:auto}
  nav button{flex:1 0 auto;position:relative;border:0;border-radius:0;margin:0;background:none;padding:8px 8px;font-size:12px;line-height:1.2;color:var(--muted);cursor:pointer;white-space:nowrap}
  nav .ni{display:block;font-size:19px}
  .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 6px;min-width:18px;line-height:18px}
  nav button.on{color:var(--brand);font-weight:700;background:var(--brand2)}
  h2{margin:8px 0 12px} h3{margin:0 0 6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card.done{opacity:.6}
  .txt{white-space:pre-wrap;word-break:break-word}
  .muted{color:var(--muted)} .err{color:var(--bad)}
  .chip{display:inline-block;background:var(--brand2);color:var(--brand);border-radius:999px;padding:2px 10px;font-size:13px;margin:0 6px 6px 0}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:2px;font-weight:700}
  input,textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;margin:4px 0 10px;background:#fff}
  textarea{min-height:90px}
  button,.btn{display:inline-block;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer;text-decoration:none;margin:4px 6px 4px 0}
  button.ghost{background:transparent;color:inherit;border:1px solid currentColor;padding:6px 12px}
  button.grey{background:#e5e7eb;color:var(--ink)} button.red{background:var(--bad)}
  label{font-size:14px;color:var(--muted)}
  .login{max-width:380px;margin:12vh auto 0;padding:20px;text-align:center}
  .login h1{margin:0 0 4px} .login input{text-align:center;font-size:22px;letter-spacing:3px;text-transform:uppercase}
  .login details input{font-size:16px;letter-spacing:0;text-transform:none}
  .login button{width:100%}
  details{margin-top:24px;text-align:left} summary{cursor:pointer;color:var(--muted);text-align:center}
  .checks label{display:flex;gap:8px;align-items:center;color:var(--ink);margin:2px 0}
  .checks input{width:auto;margin:0}
  .card.off{opacity:.55}
  label.upl{display:inline-block;background:#e5e7eb;color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer;margin:4px 6px 4px 0;font-size:16px}
  .thumbwrap{display:inline-block;width:46%;max-width:200px;margin:4px 8px 8px 0;font-size:12px;color:var(--muted);text-decoration:none;vertical-align:top}
  .thumb{width:100%;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;background:#eee}
  .thumbwrap span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frow{display:flex;align-items:center;gap:6px;margin:2px 0}
  .frow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frow button{margin:0;padding:6px 10px}
  details.box{margin-top:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 14px 6px;margin-bottom:10px}
  details.box>summary{cursor:pointer;font-weight:700;padding:12px 0;color:var(--ink);text-align:left}
  details.box[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
  .lrow{display:flex;gap:6px;align-items:center}
  .lrow input{width:auto;min-width:0;margin:4px 0}
  .lrow input:nth-child(1){flex:1} .lrow input:nth-child(2){flex:2} .lrow button{margin:0}
  button.ok{background:var(--ok)}
  details.box:not([open])>summary::after{content:"Click to expand";float:right;font-weight:400;font-size:13px;color:var(--muted)}
  .fmtbar{display:flex;gap:6px;align-items:center;margin-top:4px}
  .fmtbar button{margin:0;padding:4px 14px;background:#e5e7eb;color:var(--ink)}
  .fmtbar span{font-size:12px;color:var(--muted)}
  .fmtbar+textarea{margin-top:4px}
  .moods{display:flex;gap:10px;margin:4px 0 12px}
  .moods label{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:30px;line-height:1;color:var(--ink);cursor:pointer;padding:6px 10px;border:2px solid var(--line);border-radius:12px;background:#fff}
  .moods label small{font-size:12px;color:var(--muted)}
  .moods input{width:auto;margin:0}
  .moods label:has(input:checked){border-color:var(--brand);background:var(--brand2)}
  .card.fbnew{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand2)}
  #alert{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:30;display:none;align-items:center;gap:8px;background:#111827;color:#fff;padding:10px 12px 10px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:92%}
  #alert.show{display:flex}
  #alert button{margin:0;padding:6px 12px}

  /* ================= ANIMATIONS & POLISH ================= */
  body{background:var(--bg) linear-gradient(180deg,#e9edff 0,var(--bg) 260px) no-repeat;min-height:100vh}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes popIn{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
  @keyframes gradshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  @keyframes floaty{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-50px) scale(1.1)}66%{transform:translate(-30px,30px) scale(.95)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes ripple{to{transform:scale(1);opacity:0}}
  @keyframes reveal{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes pop{0%{transform:scale(.6) translateY(4px)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
  @keyframes slideDown{from{transform:translateY(-100%)}to{transform:none}}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes leave{to{opacity:0;transform:translateY(10px) scale(.985)}}
  @keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
  @keyframes wiggle{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.15)}}
  @keyframes conf{to{transform:translate(var(--dx),calc(var(--dy) + 90px)) rotate(var(--rot));opacity:0}}
  @keyframes dot{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
  @keyframes dropIn{from{opacity:0;transform:translate(-50%,-24px)}to{opacity:1;transform:translate(-50%,0)}}

  /* login screen */
  body.loginbg{background:linear-gradient(-45deg,#4f46e5,#7c3aed,#ec4899,#f59e0b);background-size:400% 400%;animation:gradshift 16s ease infinite}
  .blob{position:fixed;border-radius:50%;filter:blur(44px);opacity:.45;z-index:0;pointer-events:none}
  .b1{width:300px;height:300px;background:#f59e0b;top:-70px;left:-80px;animation:floaty 9s ease-in-out infinite}
  .b2{width:260px;height:260px;background:#06b6d4;bottom:-60px;right:-60px;animation:floaty 11s ease-in-out infinite reverse}
  .b3{width:190px;height:190px;background:#ec4899;top:45%;left:62%;animation:floaty 13s ease-in-out infinite}
  .login{position:relative;z-index:1;background:#fff;border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.28);padding:28px 22px;animation:popIn .65s cubic-bezier(.2,1.2,.3,1) both}
  .login h1{background:linear-gradient(90deg,#4f46e5,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:30px}
  .logo{font-size:52px;display:inline-block;animation:bob 3.2s ease-in-out infinite}
  form.shake{animation:shake .45s}

  /* buttons */
  button,.btn{position:relative;overflow:hidden;transition:transform .15s ease,box-shadow .2s ease,filter .2s ease,background .2s ease}
  button:active,.btn:active{transform:scale(.95)}
  button:focus-visible,.btn:focus-visible,summary:focus-visible{outline:3px solid rgba(79,70,229,.35);outline-offset:2px}
  @media (hover:hover){
    button:hover,.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(79,70,229,.28);filter:brightness(1.07)}
    button:active,.btn:active{transform:scale(.95)}
    button.ghost:hover{background:rgba(255,255,255,.18);box-shadow:none}
    nav button:hover{transform:none;box-shadow:none;background:var(--brand2)}
    .card:hover{box-shadow:0 8px 22px rgba(31,41,55,.09);transform:translateY(-1px)}
  }
  .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
  button.grey .ripple{background:rgba(79,70,229,.22)}
  button.loading{pointer-events:none;filter:brightness(.95)}
  button.loading::after{content:"";display:inline-block;width:14px;height:14px;margin-left:8px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
  .confetti{position:fixed;width:8px;height:12px;border-radius:2px;z-index:50;pointer-events:none;animation:conf .85s cubic-bezier(.2,.7,.3,1) forwards}

  /* cards, inputs */
  .card{box-shadow:0 1px 3px rgba(31,41,55,.05);transition:box-shadow .25s ease,transform .25s ease}
  input:not([type=checkbox]):not([type=radio]),textarea,select{transition:border-color .2s ease,box-shadow .2s ease}
  input:not([type=checkbox]):not([type=radio]):focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.15)}

  /* pages */
  #root.first header{animation:slideDown .5s cubic-bezier(.2,.9,.3,1) both}
  #root.first nav{animation:slideUp .5s cubic-bezier(.2,.9,.3,1) both}
  #root.leaving{animation:leave .28s ease forwards}
  main.enter>*{animation:fadeUp .5s cubic-bezier(.2,.7,.2,1) both}
  main.enter>*:nth-child(2){animation-delay:.05s} main.enter>*:nth-child(3){animation-delay:.1s}
  main.enter>*:nth-child(4){animation-delay:.15s} main.enter>*:nth-child(5){animation-delay:.2s}
  main.enter>*:nth-child(6){animation-delay:.25s} main.enter>*:nth-child(7){animation-delay:.3s}
  main.enter>*:nth-child(8){animation-delay:.35s} main.enter>*:nth-child(n+9){animation-delay:.4s}
  .loader{display:flex;gap:8px;justify-content:center;padding:70px 0}
  .loader i{width:12px;height:12px;border-radius:50%;background:var(--brand);animation:dot 1s ease-in-out infinite}
  .loader i:nth-child(2){animation-delay:.15s} .loader i:nth-child(3){animation-delay:.3s}

  /* bottom tabs */
  #root.tabchange nav button.on::before{content:"";position:absolute;top:0;left:18%;right:18%;height:3px;border-radius:0 0 3px 3px;background:var(--brand);transform-origin:center;animation:bar .35s ease both}
  #root.tabchange nav button.on .ni{animation:pop .45s ease}
  nav button.on::after{content:none}

  /* collapsible boxes */
  details.box>summary{list-style:none;display:block}
  details.box>summary::-webkit-details-marker{display:none}
  details.box>summary::before{content:"›";display:inline-block;width:18px;font-size:20px;line-height:1;color:var(--brand);transition:transform .25s ease}
  details.box[open]>summary::before{transform:rotate(90deg)}
  details.box[open]>*:not(summary){animation:reveal .3s ease both}
  details.box{transition:box-shadow .2s ease}
  details.box[open]{box-shadow:0 6px 18px rgba(79,70,229,.1)}

  /* small touches */
  .moods label{transition:transform .15s ease,border-color .2s ease,background .2s ease}
  .moods label:active{transform:scale(.92)}
  .moods label:has(input:checked){transform:scale(1.07)}
  .chip{transition:transform .15s ease}
  .wave{display:inline-block;transform-origin:70% 70%;animation:wave 2.2s ease-in-out .4s 1}
  .party{display:inline-block;animation:wiggle 1.4s ease-in-out infinite}
  #toast{transform:translateX(-50%) translateY(16px);transition:opacity .25s ease,transform .35s cubic-bezier(.2,1.2,.3,1)}
  #toast.show{transform:translateX(-50%) translateY(0)}
  #alert.show{animation:dropIn .45s cubic-bezier(.2,1.2,.3,1) both}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.001ms!important}
  }
  #toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90%}
  #toast.show{opacity:1}

  /* ================= polish + motion ================= */
  :root{--sun:#ffc83d;--night:#1d1b4b;--ease:cubic-bezier(.2,.7,.2,1)}
  html{-webkit-tap-highlight-color:transparent}
  body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  h2{font-weight:800;font-size:22px;letter-spacing:-.01em}
  h3{font-weight:800}
  header{box-shadow:0 2px 14px rgba(29,27,75,.25)}
  .card{border-radius:16px;box-shadow:0 1px 2px rgba(29,27,75,.05),0 8px 22px rgba(29,27,75,.06);transition:opacity .3s}

  /* buttons: lift on hover, squish on press, ripple on tap, spinner while working */
  button,.btn{position:relative;overflow:hidden;font-weight:700;transition:transform .15s var(--ease),box-shadow .2s,background-color .2s,opacity .2s}
  @media (hover:hover){
    button:not(.busy):hover,.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(29,27,75,.22)}
    nav button:hover{transform:none;box-shadow:none;background:var(--brand2)}
    header button.ghost:hover{box-shadow:none;background:rgba(255,255,255,.16)}
  }
  button:active,.btn:active{transform:scale(.95)!important;box-shadow:none!important}
  .rip{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
  button.busy{color:transparent!important;pointer-events:none}
  button.busy>*{color:transparent}
  button.busy::after{content:'';position:absolute;inset:0;margin:auto;width:18px;height:18px;border:2.5px solid #fff;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
  button.grey.busy::after{border-color:var(--ink);border-right-color:transparent}
  button:focus-visible,.btn:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
  input,textarea,select{transition:border-color .2s,box-shadow .2s}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.16)}

  /* bottom tabs */
  nav button::before{content:'';position:absolute;top:0;left:50%;width:0;height:3px;background:var(--brand);border-radius:0 0 3px 3px;transform:translateX(-50%);transition:width .25s var(--ease)}
  nav button.on::before{width:60%}
  nav button.on .ni{animation:bob .45s var(--ease)}
  .badge{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}

  /* login screen: the one big moment */
  #root{transition:opacity .22s,transform .22s}
  #root.out{opacity:0;transform:scale(.985)}
  .login-wrap{position:fixed;inset:0;background:var(--night);display:flex;align-items:center;justify-content:center;overflow:auto;padding:20px}
  .blob{position:absolute;border-radius:50%;pointer-events:none;animation:drift 22s ease-in-out infinite alternate}
  .b1{width:340px;height:340px;background:var(--brand);opacity:.55;top:-110px;left:-90px}
  .b2{width:240px;height:240px;background:var(--sun);opacity:.3;bottom:-70px;right:-50px;animation-duration:27s}
  .b3{width:170px;height:170px;background:#22c55e;opacity:.22;top:58%;left:64%;animation-duration:24s}
  #loginslot{position:relative;z-index:1}
  .login{width:min(92vw,380px);margin:0;padding:30px 24px 22px;background:#fff;border-radius:26px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
  .logo{width:68px;height:68px;margin:0 auto 10px;border-radius:20px;background:var(--brand2);display:flex;align-items:center;justify-content:center;font-size:36px}
  .login h1{font-weight:800;font-size:27px;letter-spacing:-.02em}
  .login input{font-size:28px;letter-spacing:8px;font-weight:800}
  .login details input{font-size:16px;letter-spacing:0;font-weight:600}
  .login.enter .logo{animation:logo .7s var(--ease) both}
  .login.enter>:not(.logo){animation:rise .5s var(--ease) both}
  .login.enter>:nth-child(2){animation-delay:.12s} .login.enter>:nth-child(3){animation-delay:.2s}
  .login.enter>:nth-child(4){animation-delay:.28s} .login.enter>:nth-child(5){animation-delay:.34s} .login.enter>:nth-child(6){animation-delay:.4s}
  .login.shake{animation:shake .45s}
  .login details[open]>form{animation:rise .3s var(--ease) both}
  #welcome{position:fixed;inset:0;z-index:50;background:var(--night);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;pointer-events:none;animation:welcome 1.25s ease both}
  #welcome .wmoji{font-size:64px;animation:wmoji .8s var(--ease) .1s both}
  #welcome .wtext{font-size:26px;font-weight:800;animation:rise .5s var(--ease) .2s both}

  /* moving between tabs */
  main.view-in>*{animation:rise .38s var(--ease) both}
  main.view-in>:nth-child(2){animation-delay:.04s} main.view-in>:nth-child(3){animation-delay:.08s} main.view-in>:nth-child(4){animation-delay:.12s}
  main.view-in>:nth-child(5){animation-delay:.16s} main.view-in>:nth-child(6){animation-delay:.2s} main.view-in>:nth-child(7){animation-delay:.24s}
  main.view-in>:nth-child(8){animation-delay:.28s} main.view-in>:nth-child(n+9){animation-delay:.3s}
  .skel{height:84px;border-radius:16px;margin-bottom:12px;background:linear-gradient(90deg,#e8eaf5 25%,#f5f6fc 50%,#e8eaf5 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
  .skel.s2{height:56px}
  .wave{display:inline-block;transform-origin:70% 80%;animation:wave 1.5s .35s 1}

  /* collapsible boxes */
  details.box>summary{list-style:none;position:relative;padding-left:24px}
  details.box>summary::-webkit-details-marker{display:none}
  details.box>summary::before{content:'';position:absolute;left:4px;top:50%;width:8px;height:8px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:translateY(-70%) rotate(-45deg);transition:transform .25s var(--ease)}
  details.box[open]>summary::before{transform:translateY(-30%) rotate(45deg)}
  details.box{transition:box-shadow .25s}
  details.box[open]{box-shadow:0 8px 22px rgba(29,27,75,.09)}
  details.box.opening>:not(summary){animation:fadein .3s var(--ease) both}
  .moods label{transition:transform .15s var(--ease),border-color .2s,background-color .2s}
  .moods label:active{transform:scale(.92)}
  .moods label:has(input:checked){animation:pop .3s cubic-bezier(.2,1.6,.4,1)}

  /* pop-ups */
  #toast{transform:translate(-50%,16px);transition:opacity .25s,transform .3s var(--ease)}
  #toast.show{transform:translate(-50%,0)}
  #alert.show{animation:dropin .4s cubic-bezier(.2,1.3,.4,1)}
  .cf{position:fixed;width:8px;height:12px;border-radius:2px;z-index:60;pointer-events:none;animation:cf .85s cubic-bezier(.2,.8,.4,1) forwards}

  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes fadein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
  @keyframes bob{0%{transform:none}40%{transform:translateY(-5px) scale(1.18)}100%{transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes rip{to{transform:scale(1);opacity:0}}
  @keyframes shimmer{to{background-position:-200% 0}}
  @keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
  @keyframes drift{to{transform:translate(46px,34px) scale(1.12)}}
  @keyframes logo{0%{opacity:0;transform:scale(.4) rotate(-20deg)}60%{opacity:1;transform:scale(1.12) rotate(6deg)}100%{transform:none}}

<body>
<div id="root"></div>
<div id="alert"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, collection, query, where, getDocs, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref as sref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* ====== PASTE YOUR FIREBASE CONFIG HERE (the same 4 values you used before) ====== */
const firebaseConfig = {
   apiKey: "AIzaSyBtdoMA51BnWNQVf60X0b8oO3EZnKk2RdQ",
  authDomain: "our-classroom-portal.firebaseapp.com",
  projectId: "our-classroom-portal",
  appId: "1:1063523794024:web:acd69190c6672338c88fdd",
};
/* ================================================================================== */

/* File uploads need Firebase's paid Storage plan. You are on the free plan, so they are switched off
   and you share files with links (Google Drive). Set this to true only if you ever enable Storage. */
const UPLOADS = false;

const root = document.getElementById('root');
const S = { user: null, role: null, profile: null, tab: null, planDate: null, loginMsg: '', pendingWork: [], pendingPrint: [], rid: 0, shown: null, fresh: false, loginEnter: false };
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
/* text formatting: **bold**  *italic*  __underline__  (typed by the B / I / U buttons) */
const fmt = s => s
  .replace(/\*\*([^\s*](?:[^*\n]*[^\s*])?)\*\*/g, '<b>$1</b>')
  .replace(/__([^\s_](?:[^_\n]*[^\s_])?)__/g, '<u>$1</u>')
  .replace(/\*([^\s*](?:[^*\n]*[^\s*])?)\*/g, '<i>$1</i>');
const linkify = t => fmt(esc(t)).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const secs = x => x?.createdAt?.seconds || 0;
let toastTimer;
function toast(m, ms = 2600){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms); }
function friendly(e){
  const c = e?.code || '';
  if (c.startsWith('storage/')) return c === 'storage/unauthorized' ? 'Upload not allowed. Check the Storage rules (see UPLOADS-SETUP.md).' : 'Upload problem (' + c.slice(8) + ').';
  if (c.includes('permission')) return 'Not allowed.';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') || c.includes('invalid-email')) return "That didn't work. Check it and try again.";
  if (c.includes('email-already-in-use')) return 'That code already exists. Try again.';
  if (c.includes('network')) return 'No internet connection.';
  return e?.message || 'Something went wrong.';
}

/* codes: 6 digits (older 8-letter codes still work) */
function newCode(){ return String(crypto.getRandomValues(new Uint32Array(1))[0] % 1000000).padStart(6, '0'); }
const fmtCode = c => c.length === 6 ? c.slice(0,3) + ' ' + c.slice(3) : c.slice(0,4) + '-' + c.slice(4);
const fmtDay = d => new Date(d + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const normCode = s => s.toUpperCase().replace(/[^A-Z0-9]/g, '');
const codeEmail = c => c.toLowerCase() + '@portal.local';

/* ---------- firebase ---------- */
if (firebaseConfig.apiKey.startsWith('PASTE')) {
  root.innerHTML = '<div class="login"><h1>Almost there</h1><p>Open <b>index.html</b> and paste your Firebase config at the top (the block that says PASTE YOUR FIREBASE CONFIG HERE).</p></div>';
  throw new Error('Firebase config not filled in');
}
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = UPLOADS ? getStorage(app, 'gs://' + (firebaseConfig.storageBucket || firebaseConfig.projectId + '.firebasestorage.app')) : null;
let secApp = null;
async function makeAccount(code){
  /* second app instance so creating a kid's account does not log the teacher out */
  secApp = secApp || initializeApp(firebaseConfig, 'secondary');
  const sa = getAuth(secApp);
  const cred = await createUserWithEmailAndPassword(sa, codeEmail(code), code);
  const uid = cred.user.uid;
  await signOut(sa);
  return uid;
}
/* make an account for a code; with no code given, picks a random free 6-digit one */
async function freshAccount(wanted){
  for (let n = 0; n < 12; n++) {
    const code = wanted || newCode();
    try { return { code, uid: await makeAccount(code) }; }
    catch(e) { if (e.code === 'auth/email-already-in-use' && !wanted) continue; throw e; }
  }
  throw new Error('Could not make a free code. Try again.');
}
/* all = true also returns turned-off people (one entry per person) */
async function getUsers(role, all = false){
  const s = await getDocs(query(collection(db, 'users'), where('role', '==', role)));
  const byName = (a, b) => a.name.localeCompare(b.name);
  const list = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(u => !u.replaced);
  if (!all) return list.filter(u => u.active).sort(byName);
  const by = {};
  list.forEach(u => { const c = by[u.sid]; if (!c || (u.active && !c.active) || (!!u.active === !!c.active && secs(u) > secs(c))) by[u.sid] = u; });
  return Object.values(by).sort(byName);
}

/* ---------- file uploads (Firebase Storage) ---------- */
const ACCEPT = '.pdf,image/*,.doc,.docx,.ppt,.pptx,.xls,.xlsx';
const safeName = n => n.replace(/[^\w.\- ]+/g, '_').replace(/\s+/g, '_').slice(-80);
const isImg = f => (f.type || '').startsWith('image/') || /\.(png|jpe?g|gif|webp)$/i.test(f.name || '');
const fileIcon = f => { const s = (f.type || '') + (f.name || ''); return /pdf/i.test(s) ? '📕' : /word|\.docx?$/i.test(s) ? '📘' : '📄'; };
async function uploadFiles(fileList, folder, maxMb = 20){
  const files = [...fileList], out = [];
  for (let n = 0; n < files.length; n++) {
    const f = files[n];
    if (f.size > maxMb * 1048576) { toast(f.name + ' is bigger than ' + maxMb + ' MB'); continue; }
    toast('Uploading ' + (n + 1) + ' of ' + files.length + '…', 60000);
    const path = folder + '/' + Date.now() + '-' + n + '-' + safeName(f.name);
    const r = sref(storage, path);
    await uploadBytes(r, f, { contentType: f.type || 'application/octet-stream' });
    out.push({ name: f.name, type: f.type || '', path, url: await getDownloadURL(r) });
  }
  if (out.length) toast(out.length + ' uploaded');
  return out;
}
const delFiles = paths => !UPLOADS ? Promise.resolve() : Promise.all((paths || []).filter(Boolean).map(p => deleteObject(sref(storage, p)).catch(() => {})));

/* ---------- text formatting buttons (B / I / U) for every text box ---------- */
const MARK = { b: '**', i: '*', u: '__' };
function applyFmt(ta, m){
  const mk = MARK[m], v = ta.value;
  let s = ta.selectionStart, e = ta.selectionEnd;
  while (s < e && /\s/.test(v[s])) s++;
  while (e > s && /\s/.test(v[e - 1])) e--;
  const before = v.slice(0, s), sel = v.slice(s, e), after = v.slice(e);
  let nv, a, z;
  if (before.endsWith(mk) && after.startsWith(mk) && !(m === 'i' && (before.endsWith('**') || after.startsWith('**')))) {
    nv = before.slice(0, -mk.length) + sel + after.slice(mk.length); a = s - mk.length; z = a + sel.length;   /* tapped again: remove it */
  } else {
    nv = before + mk + sel + mk + after; a = s + mk.length; z = a + sel.length;
  }
  ta.value = nv; ta.focus(); ta.setSelectionRange(a, z);
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}
function enhance(scope){
  scope.querySelectorAll('textarea:not([data-tb]):not([data-nofmt])').forEach(t => {
    t.dataset.tb = '1';
    t.insertAdjacentHTML('beforebegin', '<div class="fmtbar"><button type="button" data-a="fmt" data-m="b" title="Bold"><b>B</b></button><button type="button" data-a="fmt" data-m="i" title="Italic"><i>I</i></button><button type="button" data-a="fmt" data-m="u" title="Underline"><u>U</u></button><span>select words, then tap</span></div>');
  });
}

/* ---------- feedback alert for the teacher ---------- */
const MOODS = { great: ['😀', 'Great'], good: ['🙂', 'Good'], okay: ['😐', 'Okay'], hard: ['🙁', 'Hard'] };
let fbUnsub = null;
function updateBadge(){
  const b = document.querySelector('nav button[data-k="feedback"]');
  if (b && S.role === 'teacher') b.innerHTML = navInner('feedback', '💬 Feedback');
}
function showAlert(msg){
  const el = document.getElementById('alert');
  el.innerHTML = '<span>📝 ' + esc(msg) + '</span><button data-a="openfb">View</button><button class="ghost" data-a="closealert">✕</button>';
  el.classList.add('show');
}
function stopFbWatch(){ if (fbUnsub) { fbUnsub(); fbUnsub = null; } S.fbNew = 0; document.getElementById('alert').classList.remove('show'); }
function startFbWatch(){
  stopFbWatch();
  let first = true;
  fbUnsub = onSnapshot(collection(db, 'feedback'), snap => {
    S.fbNew = snap.docs.filter(d => d.data().status === 'new').length;
    updateBadge();
    if (first) { if (S.fbNew) showAlert(S.fbNew + ' unread feedback from subs'); }
    else {
      snap.docChanges().forEach(c => { if (c.type === 'added' && !c.doc.metadata.hasPendingWrites) showAlert('New feedback from ' + (c.doc.data().name || 'a sub')); });
      if (S.tab === 'feedback') show();
    }
    first = false;
  }, err => console.error('feedback watch', err));
}
/* images show as small pictures (tap to open full size); other files are buttons. All open in a new tab */
function filesHtml(files){
  return (files || []).filter(f => safeUrl(f.url)).map(f => isImg(f)
    ? `<a class="thumbwrap" href="${esc(f.url)}" target="_blank" rel="noopener"><img class="thumb" loading="lazy" src="${esc(f.url)}" alt=""><span>${esc(f.name)}</span></a>`
    : `<a class="btn" href="${esc(f.url)}" target="_blank" rel="noopener">${fileIcon(f)} ${esc(f.name)}</a>`).join('');
}
function renderPending(kind){
  const el = document.getElementById('pend-' + kind); if (!el) return;
  const list = kind === 'work' ? S.pendingWork : S.pendingPrint;
  el.innerHTML = list.map((f, i) => `<div class="frow"><span>${fileIcon(f)} ${esc(f.name)}</span><button type="button" class="red" data-a="pendrm" data-kind="${kind}" data-i="${i}">✕</button></div>`).join('');
}
async function handleUpload(inp){
  const files = inp.files; if (!files || !files.length) return;
  const d = inp.dataset;
  try {
    if (d.kind === 'box') {
      const it = ED[d.k][+d.i];
      const up = await uploadFiles(files, d.k === 'info' ? 'info' : 'plan/' + S.planDate);
      it.files.push(...up); it.open = true; redraw(d.k);
    } else if (d.kind === 'work') {
      S.pendingWork.push(...await uploadFiles(files, 'work')); renderPending('work');
    } else if (d.kind === 'print') {
      S.pendingPrint.push(...await uploadFiles(files, 'prints/' + S.user.uid, 10)); renderPending('print');
    }
  } catch(err) { toast(friendly(err)); }
  inp.value = '';
}

/* ---------- login ---------- */
/* ---------- motion helpers ---------- */
function ripple(el, e){
  if (reduced()) return;
  const r = el.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2;
  const x = (e.clientX || r.left + r.width / 2) - r.left - d / 2, y = (e.clientY || r.top + r.height / 2) - r.top - d / 2;
  const s = document.createElement('span'); s.className = 'rip';
  s.style.cssText = `width:${d}px;height:${d}px;left:${x}px;top:${y}px`;
  el.appendChild(s); setTimeout(() => s.remove(), 600);
}
/* a button shows a spinner (and can't be double-tapped) while its action is running */
function busy(b, p){
  if (b.closest('nav') || b.closest('.fmtbar') || b.dataset.nobusy !== undefined) return p;
  b.classList.add('busy');
  return p.finally(() => b.classList.remove('busy'));
}
function confetti(el){
  if (reduced()) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const cols = ['#4f46e5', '#ffc83d', '#22c55e', '#ef4444', '#38bdf8'];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('i'), a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 70;
    p.className = 'cf';
    p.style.cssText = `left:${cx}px;top:${cy}px;background:${cols[i % 5]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 40}px;--r:${Math.random() * 540 - 270}deg`;
    document.body.appendChild(p); setTimeout(() => p.remove(), 900);
  }
}
function playWelcome(name){
  if (reduced()) return false;
  const w = document.createElement('div'); w.id = 'welcome';
  w.innerHTML = '<div class="wmoji">👋</div><div class="wtext">Welcome, ' + esc(name) + '!</div>';
  document.body.appendChild(w);
  w.addEventListener('animationend', ev => { if (ev.target === w) w.remove(); });
  setTimeout(() => w.remove(), 2200);
  return true;
}

function renderLogin(){
  const cls = S.loginMsg ? 'shake' : S.loginEnter ? 'enter' : '';
  S.loginEnter = false;
  root.classList.remove('out');
  if (!root.querySelector('.login-wrap')) root.innerHTML = '<div class="login-wrap"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><div id="loginslot"></div></div>';
  root.querySelector('#loginslot').innerHTML = `<div class="login ${cls}">
    <div class="logo">📚</div>
    <h1>Our Classroom</h1>
    <p class="muted">Type your code to get in</p>
    <form data-form="code">
      <input id="code" placeholder="123456" autocomplete="off" inputmode="numeric" required>
      <button>Go</button>
    </form>
    <p class="err">${esc(S.loginMsg)}</p>
    <details><summary>Teacher login</summary>
      <form data-form="teacher">
        <input id="em" type="email" placeholder="Email" autocomplete="username" required>
        <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
        <button>Log in</button>
      </form>
    </details></div>`;
}
const FORMS = {
  async code(f){
    const c = normCode(f.querySelector('#code').value);
    S.loginMsg = ''; S.loginWhich = 'code'; S.fresh = true;
    try { await signInWithEmailAndPassword(auth, codeEmail(c), c); }
    catch(e){ S.fresh = false; S.loginMsg = friendly(e); renderLogin(); }
  },
  async teacher(f){
    S.loginMsg = ''; S.loginWhich = 'teacher'; S.fresh = true;
    try { await signInWithEmailAndPassword(auth, f.querySelector('#em').value.trim(), f.querySelector('#pw').value); }
    catch(e){ S.fresh = false; S.loginMsg = friendly(e); renderLogin(); }
  },
  async addstudents(f){
    const names = f.querySelector('#names').value.split('\n').map(x => x.trim()).filter(Boolean);
    for (const name of names){
      const { code, uid } = await freshAccount();
      await setDoc(doc(db, 'users', uid), { role: 'student', name, code, sid: uid, active: true, createdAt: serverTimestamp() });
    }
    toast(names.length + ' added'); show();
  },
  async addsub(f){
    const name = f.querySelector('#subname').value.trim(); if (!name) return;
    const wanted = f.querySelector('#subcode').value.trim();
    if (wanted && !/^\d{6}$/.test(wanted)) return toast('Code must be exactly 6 digits');
    const { code, uid } = await freshAccount(wanted || null);
    await setDoc(doc(db, 'users', uid), { role: 'sub', name, code, sid: uid, active: true, createdAt: serverTimestamp() });
    toast('Sub code created'); show();
  },
  async newwork(f){
    const all = f.querySelector('#toall').checked;
    const picked = [...f.querySelectorAll('.pick:checked')].map(x => x.value);
    if (!all && !picked.length) return toast('Choose who it is for');
    await addDoc(collection(db, 'assignments'), {
      title: f.querySelector('#wtitle').value.trim(), text: f.querySelector('#wtext').value.trim(),
      link: f.querySelector('#wlink').value.trim(), due: f.querySelector('#wdue').value, files: S.pendingWork,
      audience: all ? ['all'] : picked, createdAt: serverTimestamp()
    });
    toast('Posted'); show();
  },
  async print(f){
    const url = f.querySelector('#purl').value.trim();
    if (url && !safeUrl(url)) return toast('A link must start with http');
    if (!url && !S.pendingPrint.length) return toast('Paste a link or upload a file');
    await addDoc(collection(db, 'requests'), { sid: S.profile.sid, studentName: S.profile.name, url, files: S.pendingPrint, note: f.querySelector('#pnote').value.trim(), status: 'pending', createdAt: serverTimestamp() });
    toast('Sent to your teacher'); show();
  },
  async feedback(f){
    const g = id => f.querySelector(id).value.trim();
    const data = { sid: S.profile.sid, name: g('#fname'), date: f.querySelector('#fdate').value, mood: f.querySelector('input[name=mood]:checked')?.value || '',
      problems: g('#fprob'), good: g('#fgood'), suggest: g('#fsug'), planchange: g('#fplan'), status: 'new', createdAt: serverTimestamp() };
    if (!data.name || !data.date) return toast('Please add your name and the date');
    if (!data.mood && !data.problems && !data.good && !data.suggest && !data.planchange) return toast('Please fill in at least one thing');
    await addDoc(collection(db, 'feedback'), data);
    S.fbSent = true; show();
  },
  async board(f){ await setDoc(doc(db, 'board', 'main'), { text: f.querySelector('#btext').value, updatedAt: serverTimestamp() }); toast('Saved'); },
};

/* ---------- collapsible boxes (class info + day plan) ---------- */
const ED = { info: [], plan: [], planSubs: [], trash: { info: [], plan: [] } };
const blankBox = (title = '') => ({ title, text: '', links: [], files: [], open: false });
function normItems(d, legacyTitle){
  if (d && Array.isArray(d.items)) return d.items.map(i => ({ title: i.title || '', text: i.text || '', links: Array.isArray(i.links) ? i.links.map(l => ({ label: l.label || '', url: l.url || '' })) : [], files: Array.isArray(i.files) ? i.files.map(f => ({ name: f.name || '', type: f.type || '', path: f.path || '', url: f.url || '' })) : [], open: false }));
  if (d && d.text) return [{ title: legacyTitle, text: d.text, links: [], files: [], open: false }];  /* old single-textarea data */
  return [];
}
function editorHtml(k){
  const ph = k === 'plan' ? 'e.g. Period 1: Math' : 'e.g. Routines';
  const items = ED[k];
  return items.map((b, i) => `<details class="box" data-k="${k}" data-i="${i}" ${b.open ? 'open' : ''}>

      <label>Links to photos / PDFs to print</label>
      ${b.links.map((l, j) => `<div class="lrow"><input data-ed="${k}" data-i="${i}" data-j="${j}" data-f="label" placeholder="Name" value="${esc(l.label)}"><input data-ed="${k}" data-i="${i}" data-j="${j}" data-f="url" type="url" placeholder="https://…" value="${esc(l.url)}"><button class="red" data-a="edlinkdel" data-k="${k}" data-i="${i}" data-j="${j}">✕</button></div>`).join('')}
      <button class="grey" data-a="edlinkadd" data-k="${k}" data-i="${i}">＋ Add link</button><br>
      ${UPLOADS ? `<label>Uploaded files (PDF, photo, Word…)</label>

      <label class="upl">📎 Upload file<input type="file" class="fileup" multiple hidden accept="${ACCEPT}" data-kind="box" data-k="${k}" data-i="${i}"></label><br>` : ''}
      <button class="grey" data-a="edup" data-k="${k}" data-i="${i}">↑</button><button class="grey" data-a="eddown" data-k="${k}" data-i="${i}">↓</button><button class="red" data-a="eddel" data-k="${k}" data-i="${i}">Delete box</button>
    </details>`).join('')
    + `<button data-a="edadd" data-k="${k}">＋ Add box</button><button class="ok" data-a="edsave" data-k="${k}">Save</button>`;
}
const redraw = k => { const el = document.getElementById('ed-' + k); if (el) { el.innerHTML = editorHtml(k); enhance(el); } };
function boxesView(items, emptyMsg){
  const list = items.filter(b => b.title || b.text || b.links.length || b.files.length);
  if (!list.length) return `<div class="card muted">${emptyMsg}</div>`;
  return list.map(b => `<details class="box"><summary>${esc(b.title || 'Untitled')}</summary>
    <div class="txt">${linkify(b.text)}</div>
    ${filesHtml(b.files)}
    ${b.links.filter(l => safeUrl(l.url)).map(l => `<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">🖨️ ${esc(l.label || 'Open to print')}</a>`).join('')}</details>`).join('');
}

/* ---------- actions (buttons) ---------- */
async function changeCode(id){
  const old = (await getDoc(doc(db, 'users', id))).data();
  const v = prompt('New 6-digit code for ' + old.name + '\n(leave empty for a random one)', '');
  if (v === null) return;
  const wanted = v.trim();
  if (wanted && !/^\d{6}$/.test(wanted)) return toast('Code must be exactly 6 digits');
  let made;
  try { made = await freshAccount(wanted || null); }
  catch(e) { if (e.code === 'auth/email-already-in-use') return toast('That code is already used (maybe by a turned-off person). Try another.'); throw e; }
  /* same person (same sid), new login; the old login is retired */
  await setDoc(doc(db, 'users', made.uid), { role: old.role, name: old.name, code: made.code, sid: old.sid, active: !!old.active, createdAt: serverTimestamp() });
  await updateDoc(doc(db, 'users', id), { active: false, replaced: true });
  toast('Code changed'); show();
}

  <button class="grey" data-a="rename" data-id="${u.id}">Rename</button><button class="grey" data-a="setcode" data-id="${u.id}">Change code</button>
  ${u.active ? `<button class="red" data-a="setactive" data-id="${u.id}" data-v="0">Turn off</button>`
    : `<button class="ok" data-a="setactive" data-id="${u.id}" data-v="1">Turn on</button><button class="red" data-a="deluser" data-id="${u.id}">Delete</button>`}</div>`;

  edfiledel: b => { const { k, i, j } = b.dataset; const [f] = ED[k][+i].files.splice(+j, 1); if (f) ED.trash[k].push(f.path); redraw(k); },
  pendrm: async b => {

  eddown: b => { const { k } = b.dataset, i = +b.dataset.i; if (i >= ED[k].length - 1) return; [ED[k][i + 1], ED[k][i]] = [ED[k][i], ED[k][i + 1]]; redraw(k); },
  edlinkadd: b => { const it = ED[b.dataset.k][+b.dataset.i]; it.links.push({ label: '', url: '' }); it.open = true; redraw(b.dataset.k); },
  edlinkdel: b => { ED[b.dataset.k][+b.dataset.i].links.splice(+b.dataset.j, 1); redraw(b.dataset.k); },
  edsave: async b => {
    const k = b.dataset.k;

      .filter(x => x.title || x.text || x.links.length || x.files.length);
    if (items.some(x => x.links.some(l => !safeUrl(l.url)))) return toast('Links must start with http:// or https://');
    const data = k === 'info' ? { items, updatedAt: serverTimestamp() } : { items, subs: ED.planSubs, updatedAt: serverTimestamp() };
    await setDoc(doc(db, k === 'info' ? 'subinfo' : 'subplans', k === 'info' ? 'general' : S.planDate), data);
    await delFiles(ED.trash[k]); ED.trash[k] = [];
    toast('Saved');

  },
  cards: async () => {
    const list = [...await getUsers('student')];
    const w = window.open('', '_blank'); if (!w) return toast('Allow pop-ups to print');
    w.document.write('<html><head><title>Code cards</title><style>body{font-family:sans-serif}.c{display:inline-block;width:45%;border:2px dashed #999;padding:16px;margin:6px;text-align:center}.k{font:bold 28px monospace;letter-spacing:3px}</style></head><body>' +

    w.document.close(); setTimeout(() => w.print(), 400);
  }
};

document.addEventListener('pointerdown', e => {
  const b = e.target.closest('button, .btn');
  if (b && !b.disabled && !b.classList.contains('busy')) ripple(b, e);
});
document.addEventListener('click', e => {
  const s = e.target.closest('details.box>summary');
  if (s && !s.parentElement.open) { const d = s.parentElement; d.classList.add('opening'); setTimeout(() => d.classList.remove('opening'), 320); }
  const b = e.target.closest('[data-a]'); if (!b) return;
  let p; try { p = Promise.resolve(ACTIONS[b.dataset.a]?.(b)); } catch(err) { p = Promise.reject(err); }
  busy(b, p).catch(err => toast(friendly(err)));
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (!(e.ctrlKey || e.metaKey) || t.tagName !== 'TEXTAREA' || t.dataset.nofmt !== undefined) return;
  const m = { b: 'b', i: 'i', u: 'u' }[(e.key || '').toLowerCase()]; if (!m) return;
  e.preventDefault(); applyFmt(t, m);
});
document.addEventListener('submit', e => {
  const f = e.target; if (!f.dataset.form) return;
  e.preventDefault();
  const sb = e.submitter || f.querySelector('button:not([type=button])');
  const p = (async () => FORMS[f.dataset.form]?.(f))();
  (sb ? busy(sb, p) : p).catch(err => toast(friendly(err)));
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset.ed) return;
  const b = ED[t.dataset.ed]?.[+t.dataset.i]; if (!b) return;
  if (t.dataset.j !== undefined) { const l = b.links[+t.dataset.j]; if (l) l[t.dataset.f] = t.value; }
  else { b[t.dataset.f] = t.value; if (t.dataset.f === 'title') t.closest('details').querySelector('summary').textContent = t.value || '(untitled)'; }
});
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.dataset || !d.dataset.k) return;
  const b = ED[d.dataset.k]?.[+d.dataset.i]; if (b) b.open = d.open;
}, true);
document.addEventListener('change', e => {
  if (e.target.id === 'plandate' && e.target.value) { S.planDate = e.target.value; show(); }
  if (e.target.classList.contains('fileup')) { handleUpload(e.target); }
  if (e.target.classList.contains('subpick')) { ED.planSubs = [...document.querySelectorAll('.subpick:checked')].map(x => x.value); }
  if (e.target.id === 'toall') { document.querySelectorAll('.pick').forEach(x => { x.disabled = e.target.checked; if (e.target.checked) x.checked = false; }); }
});

const TABS = {
  student: [['home', '🏠 Home'], ['work', '📝 My work'], ['print', '🖨️ Print']],
  teacher: [['students', '👩‍🎓 Students'], ['work', '📝 Work'], ['print', '🖨️ Print'], ['board', '📌 Board'], ['sub', '🧑‍🏫 Sub'], ['feedback', '💬 Feedback']],

};
const navInner = (k, l) => { const i = l.indexOf(' '); return `<span class="ni">${l.slice(0, i)}</span>${esc(l.slice(i + 1))}${S.role === 'teacher' && k === 'feedback' && S.fbNew ? `<span class="badge">${S.fbNew}</span>` : ''}`; };
function shell(content){
  const nav = root.querySelector('nav');
  if (nav && root.dataset.role === S.role) {
    /* the header and bottom tabs stay put; only the page content and the highlighted tab change */
    root.querySelector('main').innerHTML = content;
    nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === S.tab));
  } else {
    root.dataset.role = S.role;
    root.innerHTML = `<header><b>${esc(S.profile.name)}</b><button class="ghost" data-a="logout" data-nobusy>Log out</button></header>
      <main>${content}</main>
      <nav>${TABS[S.role].map(([k, l]) => `<button data-a="tab" data-k="${k}" class="${S.tab === k ? 'on' : ''}">${navInner(k, l)}</button>`).join('')}</nav>`;
  }
  enhance(root);
}
async function show(){
  const my = ++S.rid, key = S.role + ':' + S.tab, fresh = S.shown !== key;
  if (fresh) { shell('<div class="skel"></div><div class="skel"></div><div class="skel s2"></div>'); window.scrollTo(0, 0); }
  let html;
  try { html = await VIEWS[key](); }
  catch(e){ console.error(e); html = '<p class="err">' + esc(friendly(e)) + '</p>'; }
  if (my !== S.rid) return;   /* a newer click already took over */
  shell(html);
  S.shown = key;
  if (fresh) {
    const m = root.querySelector('main');
    m.classList.remove('view-in'); void m.offsetWidth; m.classList.add('view-in');
    clearTimeout(S.vt); S.vt = setTimeout(() => m.classList.remove('view-in'), 900);
  }
}

async function myWork(){
  const sid = S.profile.sid, A = collection(db, 'assignments');
  const [a1, a2, d] = await Promise.all([
    getDocs(query(A, where('audience', 'array-contains', 'all'))),
    getDocs(query(A, where('audience', 'array-contains', sid))),
    getDocs(query(collection(db, 'done'), where('sid', '==', sid)))
  ]);
  const doneSet = new Set(d.docs.map(x => x.data().aid));
  const m = new Map();
  [...a1.docs, ...a2.docs].forEach(x => m.set(x.id, { id: x.id, ...x.data() }));
  return [...m.values()].map(a => ({ ...a, done: doneSet.has(a.id) })).sort((x, y) => secs(y) - secs(x));
}

      <div class="card checks"><b>Who is covering ${esc(fmtDay(S.planDate))}?</b>
        <p class="muted">Only the subs you tick can see this day's plan. Tap Save below to keep it.</p>
        ${subs.map(s => `<label><input type="checkbox" class="subpick" value="${s.sid}" ${ED.planSubs.includes(s.sid) ? 'checked' : ''}> ${esc(s.name)}${s.active ? '' : ' (off)'}</label>`).join('') || '<p class="muted">Make a sub code first.</p>'}</div>
      <p class="muted">One box per period. Add a title, instructions, and links to photos or PDFs the sub can print.</p>
      <div id="ed-plan">${editorHtml('plan')}</div>
      ${dates.length ? '<p class="muted">Days with a plan:</p>' + dates.map(d => `<button class="grey" data-a="loadplan" data-d="${d.id}">${esc(fmtDay(d.id))} · ${esc(d.names || 'no sub yet')}</button>`).join('') : ''}`;
  },

  /* ---------- sub ---------- */
  'sub:day': async () => {
    /* a sub only receives the days the teacher assigned to them */
    const s = await getDocs(query(collection(db, 'subplans'), where('subs', 'array-contains', S.profile.sid)));
    const plans = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.id.localeCompare(b.id));
    if (!plans.length) return '<h2>Day plan</h2><div class="card muted">No days have been assigned to you yet. Check Class info, or ask the teacher.</div>';
    const t = todayStr();
    if (!plans.some(p => p.id === S.planDate)) S.planDate = (plans.find(p => p.id >= t) || plans[plans.length - 1]).id;
    const p = plans.find(x => x.id === S.planDate);
    return `<h2>Day plan</h2>
      ${plans.map(x => `<button class="${x.id === S.planDate ? '' : 'grey'}" data-a="loadplan" data-d="${x.id}">${esc(fmtDay(x.id))}${x.id === t ? ' (today)' : ''}</button>`).join('')}
      <h3 style="margin-top:12px">${esc(fmtDay(p.id))}</h3>
      ${boxesView(normItems(p, 'Day plan'), 'No details for this day yet. Check Class info.')}`;
  },
  'sub:feedback': async () => {
    const sent = S.fbSent; S.fbSent = false;
    return `<h2>Feedback for the teacher</h2>
      ${sent ? '<div class="card">✅ Sent. Thank you!</div>' : ''}
      <div class="card"><p class="muted">Short is fine. Fill in only what applies.</p><form data-form="feedback">
        <label>Date</label><input id="fdate" type="date" value="${todayStr()}" required>
        <label>Your name</label><input id="fname" value="${esc(S.profile.name)}" required>
        <label>How was the day?</label>
        <div class="moods">${Object.entries(MOODS).map(([k, [em, t]]) => `<label><input type="radio" name="mood" value="${k}">${em}<small>${t}</small></label>`).join('')}</div>
        <label>Any problem with a student? (name and what happened)</label><textarea id="fprob" style="min-height:70px"></textarea>
        <label>What went well?</label><textarea id="fgood" style="min-height:70px"></textarea>
        <label>Suggestions</label><textarea id="fsug" style="min-height:70px"></textarea>
        <label>Want a change to the sub plan?</label><textarea id="fplan" style="min-height:70px"></textarea>
        <button>Send to teacher</button></form></div>`;
  },
  'sub:info': async () => {
    const i = await getDoc(doc(db, 'subinfo', 'general'));
    return `<h2>Class info</h2>${boxesView(normItems(i.exists() ? i.data() : null, 'General info'), 'Nothing here yet.')}`;
  }
};

/* ---------- session ---------- */
onAuthStateChanged(auth, async user => {
  if (!user) { stopFbWatch(); S.user = null; S.shown = null; S.loginEnter = true; renderLogin(); return; }
  S.user = user;
  let snap = null;
  try { snap = await getDoc(doc(db, 'users', user.uid)); } catch(e) { /* no profile */ }
  if (snap && snap.exists()) {
    const p = snap.data();
    if (!p.active) { S.fresh = false; S.loginMsg = 'This code has been turned off. Ask your teacher.'; await signOut(auth); return; }
    S.profile = p; S.role = p.role;
  } else {
    /* no profile = maybe the teacher; only the teacher is allowed to read the student list */
    try { await getDocs(query(collection(db, 'users'), where('role', '==', 'student'))); S.role = 'teacher'; S.profile = { name: 'Teacher' }; }
    catch(e) { S.fresh = false; S.loginMsg = 'This login has no access.'; await signOut(auth); return; }
  }
  S.tab = TABS[S.role][0][0]; S.shown = null;
  if (S.fresh) { S.fresh = false; if (playWelcome(S.profile.name)) await new Promise(r => setTimeout(r, 190)); }   /* welcome screen covers the switch */
  show();
  if (S.role === 'teacher') startFbWatch(); else stopFbWatch();
});
</script>
</body>
</html>
