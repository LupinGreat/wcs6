<script>
/* same π icon as a PNG, for browsers (Safari, iPhone home screen) that ignore SVG icons */
(function(){try{
  function make(size, round){
    var c = document.createElement('canvas'); c.width = c.height = size; var x = c.getContext('2d'); x.scale(size / 64, size / 64);
    x.fillStyle = '#4f46e5'; x.beginPath(); if (round && x.roundRect) x.roundRect(0, 0, 64, 64, 14); else x.rect(0, 0, 64, 64); x.fill();
    x.strokeStyle = '#fff'; x.lineWidth = 6; x.lineCap = 'round'; x.lineJoin = 'round';
    ['M14 22h36', 'M24 22v22c0 4-1 7-4 9', 'M40 22v20c0 6 2 9 7 9'].forEach(function(d){ x.stroke(new Path2D(d)); });
    return c.toDataURL('image/png');
  }
  var a = document.createElement('link'); a.rel = 'icon'; a.type = 'image/png'; a.href = make(64, true); document.head.appendChild(a);
  var b = document.createElement('link'); b.rel = 'apple-touch-icon'; b.href = make(180, false); document.head.appendChild(b);
}catch(e){}})();
</script>

<script>
/* ---- Install-the-app pop-up ----
   Never shown if the app is already installed (opened from the home screen) or was just installed.
   Closing it with ✕ hides it for 7 days. If nobody touches it, it disappears by itself after 5 minutes. */
(function(){
  var KEY = 'classroom-install-dismissed', WEEK = 7 * 864e5, SHOW_MS = 5 * 60 * 1000;
  function get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  if (standalone) { set('classroom-installed', '1'); return; }

  /* a manifest (built here so the site stays one file) makes the browser offer "Install" */
  try{
    function icon(size){
      var c = document.createElement('canvas'); c.width = c.height = size; var x = c.getContext('2d'); x.scale(size / 64, size / 64);
      x.fillStyle = '#4f46e5'; x.fillRect(0, 0, 64, 64);
      x.strokeStyle = '#fff'; x.lineWidth = 5; x.lineCap = 'round'; x.lineJoin = 'round';
      ['M16 24h32', 'M25 24v19c0 3-1 6-3 8', 'M39 24v17c0 5 2 8 6 8'].forEach(function(d){ x.stroke(new Path2D(d)); });
      return c.toDataURL('image/png');
    }
    var m = { name: 'Our Classroom', short_name: 'Classroom', start_url: location.origin + location.pathname, scope: location.origin + '/',
      display: 'standalone', background_color: '#4f46e5', theme_color: '#4f46e5',
      icons: [{ src: icon(192), sizes: '192x192', type: 'image/png', purpose: 'any' }, { src: icon(512), sizes: '512x512', type: 'image/png', purpose: 'any' }] };
    var l = document.createElement('link'); l.rel = 'manifest';
    l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
    document.head.appendChild(l);
  }catch(e){}

  var deferred = null, shown = false, timer = null;
  var ua = navigator.userAgent || '';
  var iOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var safariIOS = iOS && /safari/i.test(ua) && !/crios|fxios|edgios/i.test(ua);

  function recentlyClosed(){ var t = +get(KEY) || 0; return t && Date.now() - t < WEEK; }
  function hide(){ var el = document.getElementById('install'); if (el) el.classList.remove('on'); clearTimeout(timer); shown = false; }
  function show(){
    if (shown || recentlyClosed() || get('classroom-installed')) return;
    var el = document.getElementById('install'); if (!el) return;
    var how = deferred
      ? '<button type="button" class="ibtn" id="instgo">Install</button>'
      : '<div class="ihow">Tap <b>Share</b> <span class="ishare">⎋</span> then <b>Add to Home Screen</b>.</div>';
    el.innerHTML = '<div class="icard"><div class="iico">π</div><div class="itxt"><b>Get the Classroom app</b><span>Open it like an app, right from your home screen.</span>' + how + '</div><button type="button" class="iclose" aria-label="Close">✕</button></div>';
    el.querySelector('.iclose').onclick = function(){ set(KEY, String(Date.now())); hide(); };
    var go = el.querySelector('#instgo');
    if (go) go.onclick = function(){
      if (!deferred) return;
      deferred.prompt();
      deferred.userChoice.then(function(r){ if (r && r.outcome === 'accepted') set('classroom-installed', '1'); else set(KEY, String(Date.now())); deferred = null; hide(); });
    };
    el.classList.add('on'); shown = true;
    timer = setTimeout(hide, SHOW_MS);   /* no action for 5 minutes: it goes away (comes back next visit) */
  }

  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred = e; setTimeout(show, 2500); });
  window.addEventListener('appinstalled', function(){ set('classroom-installed', '1'); deferred = null; hide(); });
  window.addEventListener('load', function(){ if (safariIOS) setTimeout(show, 2500); });
})();
</script>

<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--brand:#4f46e5;--brand2:#eef2ff;--ok:#16a34a;--bad:#dc2626;--line:#e5e7eb}
  *{box-sizing:border-box}

  main{max-width:720px;margin:0 auto;padding:16px 16px calc(var(--navh,56px) + 48px)}
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);overflow-x:auto}
  nav button{flex:1 0 auto;position:relative;border:0;border-radius:0;margin:0;background:none;padding:8px 8px;font-size:12px;line-height:1.2;color:var(--muted);cursor:pointer;white-space:nowrap}
  nav .ni{display:block;font-size:19px}
  .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 6px;min-width:18px;line-height:18px}
  nav button.on{color:var(--brand);font-weight:700;background:var(--brand2)}
  h2{margin:8px 0 12px} h3{margin:0 0 6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card.done{opacity:.6}
  .txt{white-space:pre-wrap;word-break:break-word}
  .muted{color:var(--muted)} .err{color:var(--bad)}
  .chip{display:inline-block;background:var(--brand2);color:var(--brand);border-radius:999px;padding:2px 10px;font-size:13px;margin:0 6px 6px 0}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:2px;font-weight:700}
  input,textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;margin:4px 0 10px;background:#fff}
  textarea{min-height:90px}
  button,.btn{display:inline-block;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer;text-decoration:none;margin:4px 6px 4px 0}
  button.ghost{background:transparent;color:inherit;border:1px solid currentColor;padding:6px 12px}
  button.grey{background:#e5e7eb;color:var(--ink)} button.red{background:var(--bad)}
  label{font-size:14px;color:var(--muted)}
  .login{max-width:380px;margin:12vh auto 0;padding:20px;text-align:center}
  .login h1{margin:0 0 4px} .login input{text-align:center;font-size:22px;letter-spacing:3px;text-transform:uppercase}
  .login details input{font-size:16px;letter-spacing:0;text-transform:none}
  .login button{width:100%}
  details{margin-top:24px;text-align:left} summary{cursor:pointer;color:var(--muted);text-align:center}
  .checks label{display:flex;gap:8px;align-items:center;color:var(--ink);margin:2px 0}
  .checks input{width:auto;margin:0}
  .card.off{opacity:.55}
  label.upl{display:inline-block;background:#e5e7eb;color:var(--ink);border-radius:10px;padding:10px 16px;cursor:pointer;margin:4px 6px 4px 0;font-size:16px}
  .thumbwrap{display:inline-block;width:46%;max-width:200px;margin:4px 8px 8px 0;font-size:12px;color:var(--muted);text-decoration:none;vertical-align:top}
  .thumb{width:100%;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;background:#eee}
  .thumbwrap span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frow{display:flex;align-items:center;gap:6px;margin:2px 0}
  .frow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frow button{margin:0;padding:6px 10px}
  details.box{margin-top:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 14px 6px;margin-bottom:10px}
  details.box>summary{cursor:pointer;font-weight:700;padding:12px 0;color:var(--ink);text-align:left}
  details.box[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
  .lrow{display:flex;gap:6px;align-items:center}
  .lrow input{width:auto;min-width:0;margin:4px 0}
  .lrow input:nth-child(1){flex:1} .lrow input:nth-child(2){flex:2} .lrow button{margin:0}
  button.ok{background:var(--ok)}
  details.box:not([open])>summary::after{content:"Click to expand";float:right;font-weight:400;font-size:13px;color:var(--muted)}
  details.box[open]>summary::after{content:"Click to close";float:right;font-weight:400;font-size:13px;color:var(--muted)}
  .fmtbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
  .fmtbar button{margin:0;padding:4px 10px;background:#e5e7eb;color:var(--ink);line-height:1.2}
  .fmtbar button small{font-size:10px;font-weight:400;color:var(--muted);margin-left:5px;letter-spacing:.2px}
  .fmtbar button.on{background:var(--brand);color:#fff} .fmtbar button.on small{color:#e0e7ff}
  .fmtbar span{font-size:12px;color:var(--muted)}
  textarea[data-tb]{display:none}
  .rte{width:100%;min-height:90px;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;margin:4px 0 10px;background:#fff;white-space:pre-wrap;overflow-wrap:anywhere;outline:none;transition:border-color .2s,box-shadow .2s}
  .rte:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.16)}
  .rte:empty::before{content:attr(data-ph);color:#94a3b8;pointer-events:none}
  .nothing{color:#9ca3af}
  .msgs{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 2px 8px}
  .bub{max-width:82%;padding:8px 12px;border-radius:14px;background:#e5e7eb;color:var(--ink);align-self:flex-start;word-break:break-word}
  .bub.mine{align-self:flex-end;background:var(--brand);color:#fff}
  .bub small{display:block;font-size:11px;opacity:.7;margin-top:2px}
  .chatform{display:flex;gap:6px;align-items:center}
  .chatform input{margin:0;flex:1}
  .chatform button{margin:0}
  .topic{font-family:ui-monospace,Menlo,monospace;font-weight:700;background:var(--brand2);border-radius:8px;padding:8px 10px;word-break:break-all;margin:6px 0}
  .moods{display:flex;gap:10px;margin:4px 0 12px}
  .moods label{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:30px;line-height:1;color:var(--ink);cursor:pointer;padding:6px 10px;border:2px solid var(--line);border-radius:12px;background:#fff}
  .moods label small{font-size:12px;color:var(--muted)}
  .moods input{width:auto;margin:0}
  .moods label:has(input:checked){border-color:var(--brand);background:var(--brand2)}
  .card.fbnew{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand2)}
  #alert{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:30;display:none;align-items:center;gap:8px;background:#111827;color:#fff;padding:10px 12px 10px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:92%}
  #alert.show{display:flex}
  #alert button{margin:0;padding:6px 12px}

  /* party emoji */
  .party{display:inline-block;animation:wiggle 1.4s ease-in-out infinite}
  @keyframes wiggle{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.15)}}
  #toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90%}
  #toast.show{opacity:1}

  /* ================= polish + motion ================= */
  :root{--sun:#ffc83d;--night:#1d1b4b;--ease:cubic-bezier(.2,.7,.2,1)}
  html{-webkit-tap-highlight-color:transparent}
  body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  h2{font-weight:800;font-size:22px;letter-spacing:-.01em}
  h3{font-weight:800}
  header{box-shadow:0 2px 14px rgba(29,27,75,.25)}
  .card{border-radius:16px;box-shadow:0 1px 2px rgba(29,27,75,.05),0 8px 22px rgba(29,27,75,.06);transition:opacity .3s}

  /* buttons: lift on hover, squish on press, ripple on tap, spinner while working */
  button,.btn{position:relative;overflow:hidden;font-weight:700;transition:transform .15s var(--ease),box-shadow .2s,background-color .2s,opacity .2s}
  @media (hover:hover){
    button:not(.busy):hover,.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(29,27,75,.22)}
    nav button:hover{transform:none;box-shadow:none;background:var(--brand2)}
    header button.ghost:hover{box-shadow:none;background:rgba(255,255,255,.16)}
  }
  button:active,.btn:active{transform:scale(.95)!important;box-shadow:none!important}
  .rip{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
  button.busy{color:transparent!important;pointer-events:none}
  button.busy>*{color:transparent}
  button.busy::after{content:'';position:absolute;inset:0;margin:auto;width:18px;height:18px;border:2.5px solid #fff;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
  button.grey.busy::after{border-color:var(--ink);border-right-color:transparent}
  button:focus-visible,.btn:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
  input,textarea,select{transition:border-color .2s,box-shadow .2s}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,70,229,.16)}

  /* bottom tabs */
  nav button::before{content:'';position:absolute;top:0;left:50%;width:0;height:3px;background:var(--brand);border-radius:0 0 3px 3px;transform:translateX(-50%);transition:width .25s var(--ease)}
  nav button.on::before{width:60%}
  nav button.on .ni{animation:bob .45s var(--ease)}
  .badge{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}

  /* login screen: the one big moment */
  #root{transition:opacity .22s,transform .22s}
  #root.out{opacity:0;transform:scale(.985)}
  .login-wrap{position:fixed;inset:0;background:var(--night);display:flex;align-items:center;justify-content:center;overflow:auto;padding:20px}
  .blob{position:absolute;border-radius:50%;pointer-events:none;animation:drift 22s ease-in-out infinite alternate}
  .b1{width:340px;height:340px;background:var(--brand);opacity:.55;top:-110px;left:-90px}
  .b2{width:240px;height:240px;background:var(--sun);opacity:.3;bottom:-70px;right:-50px;animation-duration:27s}
  .b3{width:170px;height:170px;background:#22c55e;opacity:.22;top:58%;left:64%;animation-duration:24s}
  #loginslot{position:relative;z-index:1;margin:auto 0;padding:10px 0}
  .login-wrap{flex-direction:column;justify-content:flex-start}
  .copy{text-align:center;font-size:13px;color:var(--muted);padding:20px 0 4px}
  .login-copy{position:relative;z-index:1;color:rgba(255,255,255,.7);padding:6px 0 2px}
  .login{width:min(92vw,380px);margin:0;padding:30px 24px 22px;background:#fff;border-radius:26px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
  .logo{width:68px;height:68px;margin:0 auto 10px;border-radius:20px;background:var(--brand2);display:flex;align-items:center;justify-content:center;font-size:36px}
  .login h1{font-weight:800;font-size:27px;letter-spacing:-.02em}
  .login input{font-size:28px;letter-spacing:8px;font-weight:800}
  .login details input{font-size:16px;letter-spacing:0;font-weight:600}
  .login.enter .logo{animation:logo .7s var(--ease) both}
  .login.enter>:not(.logo){animation:rise .5s var(--ease) both}
  .login.enter>:nth-child(2){animation-delay:.12s} .login.enter>:nth-child(3){animation-delay:.2s}
  .login.enter>:nth-child(4){animation-delay:.28s} .login.enter>:nth-child(5){animation-delay:.34s} .login.enter>:nth-child(6){animation-delay:.4s}
  .login.shake{animation:shake .45s}
  .login details[open]>form{animation:rise .3s var(--ease) both}
  #welcome{position:fixed;inset:0;z-index:50;background:var(--night);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;pointer-events:none;animation:welcome 1.25s ease both}
  #welcome .wmoji{font-size:64px;animation:wmoji .8s var(--ease) .1s both}
  #welcome .wtext{font-size:26px;font-weight:800;animation:rise .5s var(--ease) .2s both}

  /* moving between tabs */
  main.view-in>*{animation:rise .38s var(--ease) both}
  main.view-in>:nth-child(2){animation-delay:.04s} main.view-in>:nth-child(3){animation-delay:.08s} main.view-in>:nth-child(4){animation-delay:.12s}
  main.view-in>:nth-child(5){animation-delay:.16s} main.view-in>:nth-child(6){animation-delay:.2s} main.view-in>:nth-child(7){animation-delay:.24s}
  main.view-in>:nth-child(8){animation-delay:.28s} main.view-in>:nth-child(n+9){animation-delay:.3s}
  .skel{height:84px;border-radius:16px;margin-bottom:12px;background:linear-gradient(90deg,#e8eaf5 25%,#f5f6fc 50%,#e8eaf5 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
  .skel.s2{height:56px}
  .wave{display:inline-block;transform-origin:70% 80%;animation:wave 1.5s .35s 1}

  /* collapsible boxes */
  details.box>summary{list-style:none;position:relative;padding-left:24px}
  details.box>summary::-webkit-details-marker{display:none}
  details.box>summary::before{content:'';position:absolute;left:4px;top:50%;width:8px;height:8px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:translateY(-70%) rotate(-45deg);transition:transform .25s var(--ease)}
  details.box[open]>summary::before{transform:translateY(-30%) rotate(45deg)}
  details.box{transition:box-shadow .25s}
  details.box[open]{box-shadow:0 8px 22px rgba(29,27,75,.09)}
  details.box.opening>:not(summary){animation:fadein .3s var(--ease) both}
  .moods label{transition:transform .15s var(--ease),border-color .2s,background-color .2s}
  .moods label:active{transform:scale(.92)}
  .moods label:has(input:checked){animation:pop .3s cubic-bezier(.2,1.6,.4,1)}

  /* pop-ups */
  #toast{transform:translate(-50%,16px);transition:opacity .25s,transform .3s var(--ease)}
  #toast.show{transform:translate(-50%,0)}
  #alert.show{animation:dropin .4s cubic-bezier(.2,1.3,.4,1)}
  .cf{position:fixed;width:8px;height:12px;border-radius:2px;z-index:60;pointer-events:none;animation:cf .85s cubic-bezier(.2,.8,.4,1) forwards}

  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes fadein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
  @keyframes bob{0%{transform:none}40%{transform:translateY(-5px) scale(1.18)}100%{transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes rip{to{transform:scale(1);opacity:0}}
  @keyframes shimmer{to{background-position:-200% 0}}
  @keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
  @keyframes drift{to{transform:translate(46px,34px) scale(1.12)}}
  @keyframes logo{0%{opacity:0;transform:scale(.4) rotate(-20deg)}60%{opacity:1;transform:scale(1.12) rotate(6deg)}100%{transform:none}}

const taSet = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;
function rteToMd(root){
  const runs = [];
  const walk = (n, st) => {
    if (n.nodeType === 3) {
      const parts = n.nodeValue.replace(/ /g, ' ').replace(/​/g, '').split('\n');
      parts.forEach((t, i) => { if (i) runs.push({ br: 1 }); if (t) runs.push({ t, b: st.b, i: st.i, u: st.u }); });
      return;
    }
    if (n.nodeType !== 1) return;
    const tag = n.tagName;
    if (tag === 'BR') { runs.push({ br: 1 }); return; }
    const x = { ...st }, cs = n.style || {};
    if (tag === 'B' || tag === 'STRONG' || /bold|^[6-9]00$/.test(cs.fontWeight || '')) x.b = 1;
    if (tag === 'I' || tag === 'EM' || cs.fontStyle === 'italic') x.i = 1;
    if (tag === 'U' || /underline/.test((cs.textDecoration || '') + (cs.textDecorationLine || ''))) x.u = 1;
    const block = (tag === 'DIV' || tag === 'P' || tag === 'LI') && n !== root;
    if (block && runs.length && !runs[runs.length - 1].br) runs.push({ br: 1 });
    n.childNodes.forEach(c => walk(c, x));
  };
  walk(root, {});
  if (runs.length && runs[runs.length - 1].br) runs.pop();   /* the browser's spare line-end mark */
  const lines = [[]];
  runs.forEach(r => { if (r.br) lines.push([]); else lines[lines.length - 1].push(r); });
  return lines.map(line => {
    const merged = [];
    line.forEach(r => { const l = merged[merged.length - 1]; if (l && !!l.b === !!r.b && !!l.i === !!r.i && !!l.u === !!r.u) l.t += r.t; else merged.push({ ...r }); });
    return merged.map(r => {
      if (!(r.b || r.i || r.u)) return r.t;
      const m = r.t.match(/^(\s*)([\s\S]*?)(\s*)$/);
      if (!m[2]) return r.t;
      const o = (r.u ? '__' : '') + (r.b ? '**' : '') + (r.i ? '*' : ''), c = (r.i ? '*' : '') + (r.b ? '**' : '') + (r.u ? '__' : '');
      return m[1] + o + m[2] + c + m[3];
    }).join('');
  }).join('\n');
}
const FMTBAR = '<div class="fmtbar"><button type="button" data-a="fmt" data-m="b" title="Bold (Ctrl+B)"><b>B</b><small>CTRL+B</small></button><button type="button" data-a="fmt" data-m="i" title="Italic (Ctrl+I)"><i>I</i><small>CTRL+I</small></button><button type="button" data-a="fmt" data-m="u" title="Underline (Ctrl+U)"><u>U</u><small>CTRL+U</small></button><span>select words, then tap (or use the shortcut keys)</span></div>';
function enhance(scope){
  scope.querySelectorAll('textarea:not([data-tb]):not([data-nofmt])').forEach(t => {
    t.dataset.tb = '1';

    r.dataset.ph = t.getAttribute('placeholder') || ''; if (t.style.minHeight) r.style.minHeight = t.style.minHeight;

/* ---------- auto log-out after 15 minutes without activity ---------- */
const IDLE_MS = 15 * 60 * 1000, WARN_MS = 60 * 1000, ACT_KEY = 'classroom-last-active';
const store = { get(){ try { return +localStorage.getItem(ACT_KEY) || 0; } catch(e){ return 0; } }, set(v){ try { localStorage.setItem(ACT_KEY, String(v)); } catch(e){} } };
let lastActive = Date.now(), lastSaved = 0;
function hideIdleWarn(){ document.getElementById('idle')?.remove(); }
function showIdleWarn(sec){
  let el = document.getElementById('idle');
  if (!el) { el = document.createElement('div'); el.id = 'idle'; el.innerHTML = '<div><b>Still there?</b><span id="idles"></span></div><button data-a="stay" data-nobusy>Stay logged in</button>'; document.body.appendChild(el); }
  el.querySelector('#idles').textContent = 'You will be logged out in ' + sec + ' second' + (sec === 1 ? '' : 's') + '.';
}
function markActive(){
  if (!S.user || S.idleOut) return;
  const n = Date.now(); lastActive = n;
  if (document.getElementById('idle')) hideIdleWarn();
  if (n - lastSaved > 5000) { lastSaved = n; store.set(n); }   /* shared with other open tabs */
}
['pointerdown', 'keydown', 'scroll', 'wheel', 'touchstart', 'input'].forEach(ev => addEventListener(ev, markActive, { passive: true, capture: true }));
function idleCheck(){
  if (!S.user || S.idleOut) return;
  const idle = Date.now() - Math.max(lastActive, store.get());
  if (idle >= IDLE_MS) {
    S.idleOut = true; hideIdleWarn();
    S.loginNote = 'You were logged out after 15 minutes of no activity.';
    ACTIONS.logout();
  } else if (idle >= IDLE_MS - WARN_MS) showIdleWarn(Math.ceil((IDLE_MS - idle) / 1000));
  else hideIdleWarn();
}
setInterval(idleCheck, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) idleCheck(); });

function ripple(el, e){
  if (reduced()) return;
  const r = el.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2;
  const x = (e.clientX || r.left + r.width / 2) - r.left - d / 2, y = (e.clientY || r.top + r.height / 2) - r.top - d / 2;
  const s = document.createElement('span'); s.className = 'rip';
  s.style.cssText = `width:${d}px;height:${d}px;left:${x}px;top:${y}px`;
  el.appendChild(s); setTimeout(() => s.remove(), 600);
}

  if (b.closest('nav') || b.closest('.fmtbar') || b.dataset.nobusy !== undefined) return p;

function confetti(el){

/* ---------- remembered through a refresh: which boxes are open, and which tab you are on ---------- */
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || 'null') ?? d; } catch(e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
const OPEN_KEY = 'classroom-open', VIEW_KEY = 'classroom-view';
const openCtx = c => (S.user?.uid || '') + '|' + (S.tid || '') + '|' + c;
const getOpen = c => lsGet(OPEN_KEY, {})[openCtx(c)] || [];
function setOpen(c, arr){
  const all = lsGet(OPEN_KEY, {}), k = openCtx(c); delete all[k]; if (arr.length) all[k] = arr;
  const keys = Object.keys(all); if (keys.length > 80) keys.slice(0, keys.length - 80).forEach(x => delete all[x]);
  lsSet(OPEN_KEY, all);
}

const blankBox = (title = '') => ({ title, text: '', links: [], files: [], open: false });
function normItems(d, legacyTitle){
  if (d && Array.isArray(d.items)) return d.items.map(i => ({ title: i.title || '', text: i.text || '', links: Array.isArray(i.links) ? i.links.map(l => ({ label: l.label || '', url: l.url || '' })) : [], files: Array.isArray(i.files) ? i.files.map(f => ({ name: f.name || '', type: f.type || '', path: f.path || '', url: f.url || '' })) : [], open: false }));

const nextDay = d => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + 1); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };

function boxesView(items, emptyMsg, ctx){
  const list = items.filter(b => b.title || b.text || b.links.length || b.files.length);
  if (!list.length) return `<div class="card muted">${emptyMsg}</div>`;
  return list.map((b, n) => {
    const links = b.links.filter(l => safeUrl(l.url)), hasText = !!b.text.trim(), has = hasText || links.length || b.files.some(f => safeUrl(f.url));
    return `<details class="box" data-ctx="${esc(ctx)}" data-n="${n}"><summary>${esc(b.title || 'Untitled')}</summary>

async function changeCode(id){
  const old = (await getDoc(doc(db, 'users', id))).data();
  const v = prompt('New 6-digit code for ' + old.name + '\n(leave empty for a random one)', '');
  if (v === null) return;
  const wanted = v.trim();
  if (wanted && !/^\d{6}$/.test(wanted)) return toast('Code must be exactly 6 digits');
  let made;
  try { made = await freshAccount(wanted || null); }
  catch(e) { if (e.code === 'auth/email-already-in-use') return toast('That code is already used (maybe by a turned-off person). Try another.'); throw e; }
  /* same person (same sid), new login; the old login is retired */
  await setDoc(doc(db, 'users', made.uid), { role: old.role, name: old.name, code: made.code, sid: old.sid, tid: old.tid, active: !!old.active, createdAt: serverTimestamp() });
  await updateDoc(doc(db, 'users', id), { active: false, replaced: true });
  toast('Code changed'); show();
}

/* deleting more than 5 people needs two warnings (the second one must be typed) */
function confirmDelete(n, what, always2 = false){
  if (!confirm('Delete ' + what + ' for good? This cannot be undone.')) return false;
  if (n <= 5 && !always2) return true;
  const t = prompt('⚠️ Final warning: ' + what + ' will be removed permanently, with their work and records.\n\nType DELETE to confirm.', '');
  return (t || '').trim() === 'DELETE';
}
const delAll = async q => { const x = await getDocs(q); await Promise.all(x.docs.map(d => deleteDoc(d.ref))); };
/* remove a student or sub completely: every login record for them, plus their ticks and print requests */
async function purgePeople(ids){

    const u = (await getDoc(doc(db, 'users', id))).data(); if (!u) continue;
    const mine = c => query(collection(db, c), where('tid', '==', S.tid), where('sid', '==', u.sid));
    await delAll(mine('users')); await delAll(mine('done')); await delAll(mine('requests')); await delAll(mine('messages'));
    await deleteDoc(doc(db, 'users', id)).catch(() => {});

}

/* ---------- autosave (sub editors + board), drafts (forms), status line ---------- */
const AUTOSAVE_TABS = new Set(['sub', 'board']), DRAFT_TABS = new Set(['work', 'students']);
function idleText(){
  if (S.role !== 'teacher' || S.locked) return '';
  if (AUTOSAVE_TABS.has(S.tab)) return '✓ Autosave is on: your changes save by themselves';
  if (DRAFT_TABS.has(S.tab)) return '✓ Unfinished text is kept as a draft on this device';
  return '';
}
function setSave(kind){
  const el = document.getElementById('savebar'); if (!el) return;
  const time = new Date().toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  const T = { saving: 'Saving…', saved: '✓ All changes saved · ' + time, error: '⚠ Could not save yet. Trying again…', warn: '⚠ A link must start with http:// or https:// before it can be saved',
    draft: '✓ Draft kept on this device', restored: '✓ Your unfinished draft was brought back', idle: idleText() };
  el.textContent = T[kind] ?? ''; el.dataset.k = kind;
}
function cleanItems(k){
  return ED[k].map(x => ({ title: x.title.trim(), text: x.text.trim(), links: x.links.map(l => ({ label: l.label.trim(), url: l.url.trim() })).filter(l => l.url), files: x.files.map(f => ({ name: f.name, type: f.type, path: f.path, url: f.url })) }))
    .filter(x => x.title || x.text || x.links.length || x.files.length);
}
/* writes one editor to the database; the teacher and date are the ones the editor was loaded for */
async function saveEditor(k, auto){
  const items = cleanItems(k);
  if (items.some(x => x.links.some(l => !safeUrl(l.url)))) { if (!auto) toast('Links must start with http:// or https://'); return false; }
  const tid = S.edTid || S.tid, date = S.edDate || S.planDate;
  const data = k === 'info' ? { items, tid, updatedAt: serverTimestamp() } : { items, subs: ED.planSubs, tid, date, updatedAt: serverTimestamp() };
  await setDoc(doc(db, k === 'info' ? 'subinfo' : 'subplans', k === 'info' ? tid : tid + '_' + date), data);
  await delFiles(ED.trash[k]); ED.trash[k] = [];
  S.cache = {};
  return true;
}
async function saveBoard(){ await setDoc(doc(db, 'board', S.boardTid || S.tid), { text: S.boardText, updatedAt: serverTimestamp() }); S.cache = {}; }
let flushing = null;
function scheduleSave(what){
  S.pend.add(what); setSave('saving');
  clearTimeout(S.saveT); S.saveT = setTimeout(flushSaves, 1500);
}
async function flushSaves(){
  clearTimeout(S.saveT);
  if (flushing) { try { await flushing; } catch(e) {} }
  if (!S.pend.size) return;
  const jobs = [...S.pend]; S.pend.clear();
  flushing = (async () => {
    setSave('saving');
    let warn = false;
    try {
      for (const j of jobs) { if (j === 'board') await saveBoard(); else if (!(await saveEditor(j, true))) warn = true; }
      setSave(warn ? 'warn' : 'saved');
    } catch(e) {
      console.error('autosave', e);
      jobs.forEach(j => S.pend.add(j)); setSave('error');
      clearTimeout(S.saveT); S.saveT = setTimeout(flushSaves, 5000);
    }
  })();
  try { await flushing; } finally { flushing = null; }
}

/* forms that publish something are never sent by themselves; their text is kept on this device until they are sent */
const DRAFTS = { newwork: ['wtitle', 'wtext', 'wlink', 'wdue'], addstudents: ['names'], addsub: ['subname', 'subcode'] };
const draftKey = n => 'classroom-draft-' + (S.user?.uid || '') + '-' + S.tid + '-' + n;
let draftT = null;
function saveDraft(form){
  const n = form.dataset.form, ids = DRAFTS[n]; if (!ids) return;
  clearTimeout(draftT);
  draftT = setTimeout(() => {
    const vals = {}; ids.forEach(id => { const el = form.querySelector('#' + id); if (el && el.value) vals[id] = el.value; });
    try { if (Object.keys(vals).length) localStorage.setItem(draftKey(n), JSON.stringify(vals)); else localStorage.removeItem(draftKey(n)); } catch(e) {}
    setSave('draft');
  }, 400);
}
function clearDraft(n){ try { localStorage.removeItem(draftKey(n)); } catch(e) {} }
function restoreDrafts(){
  Object.keys(DRAFTS).forEach(n => {
    const f = root.querySelector(`form[data-form="${n}"]`); if (!f) return;
    let vals = null; try { vals = JSON.parse(localStorage.getItem(draftKey(n)) || 'null'); } catch(e) {}
    if (!vals) return;
    let any = false;
    Object.entries(vals).forEach(([id, v]) => { const el = f.querySelector('#' + id); if (el && !el.value) { el.value = v; any = true; } });
    if (any) setSave('restored');
  });
}

async function show(){
  saveView();

  const my = ++S.rid, key = S.role + ':' + S.tab, fresh = S.shown !== key;
  if (key !== 'sub:chat') stopSubChat();
  /* opening a tab again shows what it had last time at once, then quietly swaps in the fresh data */
  const cached = fresh && CACHEABLE.has(key) ? S.cache[key] : undefined;
  const animate = () => { const m = root.querySelector('main'); m.classList.remove('view-in'); void m.offsetWidth; m.classList.add('view-in'); clearTimeout(S.vt); S.vt = setTimeout(() => m.classList.remove('view-in'), 900); };
  if (fresh) { shell(cached !== undefined ? cached : '<div class="skel"></div><div class="skel"></div><div class="skel s2"></div>'); window.scrollTo(0, 0); S.dirty = false; if (cached !== undefined) { S.shown = key; animate(); } }
  let html;

  catch(e){ console.error(e); html = (String(e?.code || '').includes('permission') && (S.role === 'student' || S.role === 'sub')) ? '<div class="card"><h3>Class paused</h3><p class="muted">This class is not available right now. Please tell your teacher.</p></div>' : '<p class="err">' + esc(friendly(e)) + '</p>'; }
  if (my !== S.rid) return;   /* a newer click already took over */
  if (CACHEABLE.has(key)) S.cache[key] = html;
  if (cached !== undefined) {
    /* the old copy is already on screen: swap only if something changed, and never while the person is typing */
    if (html !== cached && !S.dirty) shell(html);
    return;
  }
  shell(html);
  S.shown = key;
  if (fresh) animate();

    const list = ps.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.status === 'pending') - (a.status === 'pending') || secs(b) - secs(a));
    const chipFor = x => x.status === 'approved' ? '<span class="pill g">Approved</span>' : x.status === 'rejected' ? '<span class="pill r">Not received</span>' : '<span class="pill y">To check</span>';
    return `<h2>Payments</h2><p class="muted" style="margin-top:-6px">Check your bank for an e-Transfer with the teacher's reference number, then approve it.</p>
      ${list.map(x => { const t = by[x.tid] || {};
        return `<div class="card"><h3>${esc(t.name || 'Unknown teacher')} ${chipFor(x)}</h3>
          <div class="muted">${esc(t.email || '')}</div>
          <div><b>${money(x.amount)} ${esc(x.currency || '')}</b> · ${x.months} month${x.months > 1 ? 's' : ''} · reference <b>${esc(x.ref || '')}</b></div>
          <div class="muted">${x.createdAt ? fmtDate(secs(x) * 1000) : ''}${x.note ? ' · ' + esc(x.note) : ''}</div>
          ${x.status === 'pending' ? `<button class="ok" data-a="payok" data-id="${x.id}">I received it: approve</button><button class="red" data-a="payno" data-id="${x.id}">Not received</button>` : ''}</div>`; }).join('') || '<p class="muted">No payments yet.</p>'}`;
  },
  'admin:settings': async () => {
    const st = await getSettings();
    return `<h2>Settings</h2><div class="card"><form data-form="settings">
      <label>Price per month</label><input id="sprice" type="number" step="0.01" min="0" value="${st.price}" required>
      <label>Currency label (for example CAD)</label><input id="scur" maxlength="6" value="${esc(st.currency)}">
      <label>Free trial length (days)</label><input id="strial" type="number" min="0" step="1" value="${st.trialDays}" required>
      <label>Send e-Transfers to (email)</label><input id="spay" type="email" value="${esc(st.payEmail)}">
      <label>Extra payment note (optional, teachers see it)</label><textarea id="snote" data-nofmt style="min-height:70px">${esc(st.payNote)}</textarea>
      <button>Save settings</button></form></div>
      <p class="muted">A new price applies to new payments. The trial length applies to teachers you approve from now on.</p>`;
  },

  /* ---------- sub ---------- */
  'sub:day': async () => {
    /* a sub only receives the days the teacher assigned to them */
    const s = await getDocs(query(collection(db, 'subplans'), where('tid', '==', S.tid), where('subs', 'array-contains', S.profile.sid)));
    const plans = s.docs.map(d => ({ ...d.data(), id: d.data().date })).sort((a, b) => a.id.localeCompare(b.id));
    if (!plans.length) return '<h2>Day plan</h2><div class="card muted">No days have been assigned to you yet. Check Class info, or ask the teacher.</div>';
    const t = todayStr();
    if (!plans.some(p => p.id === S.planDate)) S.planDate = (plans.find(p => p.id >= t) || plans[plans.length - 1]).id;
    const p = plans.find(x => x.id === S.planDate);
    return `<h2>Day plan</h2>
      ${plans.map(x => `<button class="${x.id === S.planDate ? '' : 'grey'}" data-a="loadplan" data-d="${x.id}">${esc(fmtDay(x.id))}${x.id === t ? ' (today)' : ''}</button>`).join('')}
      <h3 style="margin-top:12px">${esc(fmtDay(p.id))}</h3>
      ${boxesView(normItems(p, 'Day plan'), 'No details for this day yet. Check Class info.', 'day-' + p.id)}`;
  },
  'sub:feedback': async () => {
    if (S.fbSent) return `<div class="card fbdone">
      <svg class="okmark" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24" fill="none" stroke="#16a34a" stroke-width="3"/><path fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M15 27l8 8 14-16"/></svg>
      <h2>Report sent</h2><p class="muted">Thank you. Your teacher has been notified.</p>
      <button data-a="fbnew">Submit another report</button></div>`;
    const seg = (name, opts, cls = '') => `<div class="seg ${cls}">${opts.map(([v, t, c]) => `<label class="${c || ''}"><input type="radio" name="${name}" value="${v}">${t}</label>`).join('')}</div>`;
    return `<h2>Substitute report</h2>
      <p class="muted" style="margin-top:-6px">Takes about a minute. Only the date, your name and the overall rating are required.</p>
      <form data-form="feedback">
        <div class="card fsec"><div class="fh"><span>1</span>Day details</div>
          <div class="frow2">
            <div><label for="fdate">Date *</label><input id="fdate" type="date" value="${todayStr()}" required></div>
            <div><label for="fname">Your name *</label><input id="fname" value="${esc(S.profile.name)}" required></div>
          </div></div>
        <div class="card fsec"><div class="fh"><span>2</span>Overall</div>
          <label>How did the day go? *</label>${seg('rating', [['excellent', 'Excellent', 'r-g'], ['good', 'Good', 'r-g'], ['fair', 'Fair', 'r-y'], ['difficult', 'Difficult', 'r-r']], 'four')}
          <label style="margin-top:14px">Was the sub plan easy to follow?</label>${seg('planfollow', [['yes', 'Yes'], ['mostly', 'Mostly'], ['no', 'No']])}</div>
        <div class="card fsec"><div class="fh"><span>3</span>Students</div>
          <label>Student concerns <small>(optional)</small></label>
          <div id="fb-rows">${concernRow()}</div>
          <button type="button" class="grey" data-a="fbaddrow" data-nobusy>＋ Add another student</button>
          <label for="fshout" style="margin-top:12px">Students who did well <small>(optional)</small></label>
          <textarea id="fshout" data-nofmt style="min-height:64px" placeholder="Names and what they did well"></textarea></div>
        <div class="card fsec"><div class="fh"><span>4</span>Notes for the teacher</div>
          <label for="fgood">What went well <small>(optional)</small></label><textarea id="fgood" data-nofmt style="min-height:64px"></textarea>
          <label for="fsug">Suggestions <small>(optional)</small></label><textarea id="fsug" data-nofmt style="min-height:64px"></textarea>
          <label for="fplan">Requested changes to the sub plan <small>(optional)</small></label><textarea id="fplan" data-nofmt style="min-height:64px"></textarea></div>
        <button class="fsubmit">Submit report</button>
      </form>`;
  },
  'sub:chat': async () => {
    const pf = await getDoc(doc(db, 'prefs', S.tid));
    if (!pf.exists() || !pf.data().chatOn) { S.chatPrefs = null; return '<h2>Chat</h2><div class="card nothing">Nothing to show</div>'; }
    S.chatPrefs = pf.data();
    return `<h2>Chat with the teacher</h2><div class="card"><div class="msgs" id="chatlist"></div>
      <form data-form="chatsend" class="chatform"><input maxlength="1000" placeholder="Write a message…" aria-label="Message" required><button>Send</button></form>
      <p class="muted" style="margin:8px 0 0">Your teacher is told when you write. Replies show up here.</p></div>`;
  },
  'sub:info': async () => {
    const i = await getDoc(doc(db, 'subinfo', S.tid));
    return `<h2>Class info</h2>${boxesView(normItems(i.exists() ? i.data() : null, 'General info'), 'Nothing here yet.', 'info')}`;
  }
};

/* ---------- session ---------- */
function renderGate(kind){
  const p = S.profile || {};
  const m = kind === 'pending' ? ['⏳', 'Waiting for approval', 'Thanks for signing up! Your account will be switched on once it is approved.'] : ['⛔', 'Account inactive', 'This account is not active right now. Please contact the site owner.'];
  root.classList.remove('out'); delete root.dataset.role;
  root.innerHTML = '<div class="login-wrap"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><div id="loginslot"></div><footer class="copy login-copy">© 2026 Mr. D. All rights reserved.</footer></div>';
  root.querySelector('#loginslot').innerHTML = `<div class="login enter"><div class="logo">${m[0]}</div><h1>${m[1]}</h1><p class="muted">${m[2]}</p>
    ${kind === 'pending' ? `<p class="note">Signed up as ${esc(p.email || '')}</p><button data-a="recheck">Check again</button>` : ''}
    <button class="grey" data-a="logout" data-nobusy style="margin-top:8px">Log out</button></div>`;
}
async function enter(user){
  lastActive = Date.now(); lastSaved = lastActive; store.set(lastActive); S.idleOut = false; S.user = user; S.cache = {};
  let snap = null;
  try { snap = await getDoc(doc(db, 'users', user.uid)); } catch(e) { /* no profile */ }
  let p = snap && snap.exists() ? snap.data() : null;
  const out = async msg => { S.fresh = false; S.loginMsg = msg; await signOut(auth); };
  if (!p && (user.email || '').toLowerCase() === OWNER_EMAIL.toLowerCase()) {
    /* the owner's first login creates the admin profile (the database rules only allow this for the owner's user ID) */
    try { p = { role: 'admin', name: 'Owner', email: user.email, createdAt: serverTimestamp() }; await setDoc(doc(db, 'users', user.uid), p); }
    catch(e) { S.loginWhich = 'teacher'; return out('Owner setup is not finished: paste your user ID into the database rules (see SETUP-MULTI.md).'); }
  }
  if (!p) { S.loginWhich = 'teacher'; return out('This login has no access.'); }
  S.isAdmin = false; S.locked = null; S.tid = null; S.viewing = null;
  if (p.role === 'student' || p.role === 'sub') {
    if (!p.tid) return out('This code is from the old system. Ask your teacher for a new one.');
    if (!p.active) return out('This code has been turned off. Ask your teacher.');
    S.tid = p.tid;
  } else if (p.role === 'teacher') {
    S.tid = user.uid;
    if (p.status === 'pending') S.locked = 'pending';
    else if (p.status === 'blocked') S.locked = 'blocked';
    else if (msOf(p.paidUntil) <= Date.now()) S.locked = 'expired';
  } else if (p.role === 'admin') { S.isAdmin = true; S.tid = user.uid; }
  else return out('This login has no access.');
  S.profile = p; S.role = p.role;
  if (S.locked === 'pending' || S.locked === 'blocked') { S.fresh = false; stopFbWatch(); renderGate(S.locked); return; }
  /* a refresh brings you back to the same tab (and, for the owner, the same teacher's class) */
  const sv = loadView(user.uid);
  if (sv && p.role === 'admin' && sv.role === 'teacher') { S.role = 'teacher'; if (sv.viewing && sv.viewing.id) { S.viewing = sv.viewing; S.tid = sv.viewing.id; } }
  const keys = tabsFor().map(t => t[0]);
  S.tab = sv && sv.role === S.role && keys.includes(sv.tab) ? sv.tab : keys[0]; S.shown = null;
  if (sv && sv.role === S.role && /^\d{4}-\d\d-\d\d$/.test(sv.planDate || '')) S.planDate = sv.planDate;
  if (S.fresh) { S.fresh = false; if (playWelcome(S.profile.name)) await new Promise(r => setTimeout(r, 190)); }   /* welcome screen covers the switch */
  show();
  if (S.role === 'teacher' && !S.locked) startFbWatch(); else if (S.role === 'admin') startAdminWatch(); else stopFbWatch();
}
onAuthStateChanged(auth, async user => {
  if (S.signingUp) return;   /* the sign-up form finishes the job itself */
  if (!user) { try { localStorage.removeItem(VIEW_KEY); } catch(e) {} stopFbWatch(); hideIdleWarn(); S.cache = {}; S.user = null; S.profile = null; S.tid = null; S.isAdmin = false; S.locked = null; S.shown = null; S.idleOut = false; S.fbSent = false; S.loginEnter = true; delete root.dataset.role; renderLogin(); return; }
  if (!S.fresh) {   /* a saved session from an earlier visit: only keep it if it was used in the last 15 minutes */
    const last = store.get();
    if (last && Date.now() - last > IDLE_MS) { S.loginNote = 'You were logged out after 15 minutes of no activity.'; await signOut(auth); return; }
  }
  await enter(user);
});
</script>
